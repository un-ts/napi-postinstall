name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - name: Setup Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: yarn

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: |
          corepack enable npm
          corepack enable
          yarn --immutable

      - name: Build
        run: yarn build

      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: 'chore: release napi-postinstall'
          pr-title: 'chore: release napi-postinstall'
          publish-script: yarn release
          version-script: yarn run version
        env:
          SKIP_SIMPLE_GIT_HOOKS: 1
